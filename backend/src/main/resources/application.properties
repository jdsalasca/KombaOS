spring.application.name=kombaos-backend

kombaos.environment=${ENVIROMENT:${ENVIRONMENT:cloud}}
kombaos.local-storage-dir=${KOMBAOS_LOCAL_STORAGE_DIR:${user.home}/.kombaos}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${kombaos.local-storage-dir}/db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=${FLYWAY_ENABLED:true}

kombaos.security.enabled=${KOMBAOS_SECURITY_ENABLED:false}
kombaos.security.users.admin.username=${KOMBAOS_ADMIN_USER:admin}
kombaos.security.users.admin.password=${KOMBAOS_ADMIN_PASSWORD:admin123}
kombaos.security.users.operacion.username=${KOMBAOS_OPERACION_USER:operacion}
kombaos.security.users.operacion.password=${KOMBAOS_OPERACION_PASSWORD:operacion123}
kombaos.security.users.comercial.username=${KOMBAOS_COMERCIAL_USER:comercial}
kombaos.security.users.comercial.password=${KOMBAOS_COMERCIAL_PASSWORD:comercial123}
